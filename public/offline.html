<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você está offline — DevDock</title>
  <style>
    :root {
      --bg-color: #0A0A0A;
      --surface-color: #111111;
      --card-color: #171717;
      --border-color: #2A2A2A;
      --text-primary: #FFFFFF;
      --text-secondary: #A3A3A3;
      --accent-color: #5379AE;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .logo-container {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card-color);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .logo-container img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .btn {
      margin-top: 0.5rem;
      background-color: var(--text-primary);
      color: var(--bg-color);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.75rem 1.75rem;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/logo.png" alt="DevDock Logo">
    </div>
    <h1>Você está offline</h1>
    <p>Verifique sua conexão com a internet para carregar novas páginas e sincronizar com o banco de dados do DevDock.</p>
    <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
