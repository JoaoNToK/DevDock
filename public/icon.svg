<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#A3A3A3"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#2A2A2A" stroke-width="8"/>

  <!-- DevDock Icon Emblem (D + Terminal Prompt) -->
  <path d="M140 136 C 240 136, 360 180, 360 256 C 360 332, 240 376, 140 376 Z" fill="none" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="140" y1="136" x2="140" y2="376" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round"/>
  
  <!-- Terminal Prompt inside D -->
  <polyline points="200,216 240,256 200,296" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="260" y1="296" x2="290" y2="296" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
</svg>