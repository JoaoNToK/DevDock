name: DevDock Quality Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. ESLint Check
        run: npm run lint

      - name: 2. TypeScript Static Typecheck
        run: npm run typecheck

      - name: 3. Automated Test Suite
        run: npm run test

      - name: 4. Next.js Production Build
        run: npm run build
